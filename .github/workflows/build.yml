name: Build Astrograms APK

on:
  push:
    branches: [ master, astrograms-rebuild ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init media submodule
        run: |
          git submodule update --init TMessagesProj_Modules/media

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (NDK 27 + CMake 3.22)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Publish build log to issue (for debugging)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAIL=$(tail -n 80 build.log 2>/dev/null || echo 'no build.log')
          BODY=$(printf '```\n%s\n```' "$TAIL")
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/xxtatori-cloud/Telegram-Android/issues \
            -d "{\"title\":\"CI build log $(date -u +%Y%m%dT%H%M%SZ)\",\"body\":$(echo "$BODY" | jq -Rs .),\"labels\":[\"ci-log\"]}"

      - name: Verify APK exists
        id: verify
        run: |
          if [ -f TMessagesProj_App/build/outputs/apk/afat/release/app.apk ]; then
            echo "apk_ok=true" >> $GITHUB_OUTPUT
            ls -la TMessagesProj_App/build/outputs/apk/afat/release/
          else
            echo "apk_ok=false" >> $GITHUB_OUTPUT
            echo "APK not found"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: steps.verify.outputs.apk_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Astrograms-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Create Release
        if: steps.verify.outputs.apk_ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: astrograms-${{ github.run_number }}
          name: Astrograms ${{ github.run_number }}
          files: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if build failed
        if: steps.verify.outputs.apk_ok != 'true'
        run: exit 1