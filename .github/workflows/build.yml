name: Build Astrograms APK

on:
  push:
    branches: [ master, astrograms-rebuild ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          export ANDROID_HOME=$SDK
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Verify APK exists
        run: |
          ls -la TMessagesProj_App/build/outputs/apk/afat/release/
          test -f TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrograms-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: astrograms-${{ github.run_number }}
          name: Astrograms ${{ github.run_number }}
          files: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}